<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="書見">
<title>書見 — 小説リーダー</title>
<style>
:root{
  --ink:#2b2b2b; --paper:#ffffff; --paper2:#f4f4f4; --line:#e2e2e2;
  --accent:#2f4f6f; --accent-ink:#ffffff; --muted:#8a8a8a;
  --radius:14px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  background:var(--paper);color:var(--ink);
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.hidden{display:none!important}

/* ===== 本棚 ===== */
#shelf{min-height:100%;background:var(--paper2);padding-bottom:calc(90px + var(--sab))}
.shelf-head{
  padding:calc(18px + var(--sat)) 20px 14px;
  background:var(--paper);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:5;
}
.shelf-head h1{font-size:22px;font-weight:700;letter-spacing:.12em;
  font-family:"Hiragino Mincho ProN","Noto Serif JP",serif}
.shelf-head p{font-size:12px;color:var(--muted);margin-top:3px}
#bookList{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.book{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;display:flex;align-items:center;gap:14px;text-align:left;width:100%;
}
.book:active{transform:scale(.985)}
.spine{
  width:8px;align-self:stretch;border-radius:4px;background:var(--accent);flex:none;
  min-height:52px;
}
.book-info{flex:1;min-width:0}
.book-title{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:"Hiragino Mincho ProN","Noto Serif JP",serif}
.book-meta{font-size:12px;color:var(--muted);margin-top:5px;display:flex;gap:10px;align-items:center}
.prog-track{flex:1;height:3px;background:var(--line);border-radius:2px;max-width:110px}
.prog-fill{height:100%;background:var(--accent);border-radius:2px}
.book-del{color:var(--muted);font-size:18px;padding:8px;flex:none}
#empty{padding:60px 30px;text-align:center;color:var(--muted);font-size:14px;line-height:2}
#empty .mark{font-size:40px;display:block;margin-bottom:14px;font-family:"Hiragino Mincho ProN",serif;color:var(--accent)}
#addBtn{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--sab));
  background:var(--accent);color:var(--accent-ink);
  padding:15px 30px;border-radius:999px;font-size:15px;font-weight:600;letter-spacing:.06em;
  box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:5;
}
#addBtn:active{transform:translateX(-50%) scale(.96)}
#memWarn{margin:0 16px;padding:10px 14px;border-radius:10px;background:#fff6e0;color:#7a5b00;font-size:12px;line-height:1.7}

/* ===== リーダー ===== */
#reader{position:fixed;inset:0;background:var(--paper);z-index:20;display:flex;flex-direction:column}
#readerScroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#readerContent{
  max-width:660px;margin:0 auto;
  padding:calc(64px + var(--sat)) var(--rmargin,24px) calc(120px + var(--sab));
  font-size:var(--fsize,17px);line-height:var(--lheight,1.95);letter-spacing:var(--lspace,0.04em);
  font-family:var(--rfont);
  font-feature-settings:"palt" 0;
  text-align:justify;overflow-wrap:break-word;
}
/* 縦書き */
#reader.vertical #readerScroll{overflow-y:hidden;overflow-x:auto}
#reader.vertical #readerContent{
  writing-mode:vertical-rl;height:100%;max-width:none;width:max-content;margin:0;
  padding:calc(64px + var(--sat)) 28px calc(90px + var(--sab));
  padding-left:32px;padding-right:32px;
}
#reader.vertical #readerContent h1,
#reader.vertical #readerContent h2,
#reader.vertical #readerContent h3{border-bottom:none;padding-bottom:0}
#readerContent p{margin:0}
#readerContent p+p{margin-top:calc(var(--pgap,0) * 1em)}
#readerContent.indent p{text-indent:1em}
#readerContent h1,#readerContent h2,#readerContent h3,#readerContent h4{
  font-weight:700;line-height:1.6;margin:2.2em 0 1.1em;
  font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;
}
#readerContent h1{font-size:1.45em}
#readerContent h2{font-size:1.25em}
#readerContent h3{font-size:1.1em}
#readerContent h4{font-size:1em}
#readerContent h1:first-child{margin-top:.5em}
#readerContent hr{border:none;text-align:center;margin:2.4em 0;color:var(--muted)}
#readerContent hr::before{content:"＊　＊　＊";font-size:.85em;letter-spacing:.3em}
#readerContent blockquote{
  border-left:3px solid var(--line);padding-left:1em;color:var(--muted);margin:1.2em 0;
}
#reader.vertical #readerContent blockquote{border-left:none;border-top:3px solid var(--line);padding-left:0;padding-top:1em}
#readerContent em{font-style:normal;text-emphasis:filled sesame;-webkit-text-emphasis:filled sesame}
#readerContent strong{font-weight:700}
#readerContent code{background:var(--paper2);border-radius:4px;padding:.1em .35em;font-size:.9em}
#readerContent ul,#readerContent ol{padding-left:1.4em;margin:1em 0}
#readerContent rt{font-size:.5em}

/* バー */
.bar{position:absolute;left:0;right:0;z-index:2;transition:opacity .22s,visibility .22s;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:color-mix(in srgb,var(--paper) 82%,transparent)}
#topBar{top:0;padding:calc(10px + var(--sat)) 12px 10px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--line)}
#topBar .rtitle{flex:1;font-size:14px;font-weight:600;text-align:center;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
  font-family:"Hiragino Mincho ProN","Noto Serif JP",serif}
#bottomBar{bottom:0;padding:12px 18px calc(14px + var(--sab));border-top:1px solid var(--line)}
.bar-btn{padding:9px 14px;font-size:14px;color:var(--accent);font-weight:600;flex:none}
#reader.bars-hidden .bar{opacity:0;visibility:hidden}
#progRow{display:flex;align-items:center;gap:12px}
#progPct{font-size:12px;color:var(--muted);width:44px;text-align:right;font-variant-numeric:tabular-nums}
#progSlider{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--line);outline:none}
#progSlider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--accent);border:3px solid var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.25)}

/* ===== 設定シート ===== */
#sheetBack{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;opacity:0;transition:opacity .25s;pointer-events:none}
#sheetBack.open{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--paper);
  border-radius:20px 20px 0 0;max-height:78vh;overflow-y:auto;
  padding:10px 20px calc(24px + var(--sab));
  transform:translateY(105%);transition:transform .28s cubic-bezier(.3,.9,.3,1);
  box-shadow:0 -8px 30px rgba(0,0,0,.18);
}
#sheet.open{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.set-group{padding:14px 0;border-bottom:1px solid var(--line)}
.set-group:last-child{border-bottom:none}
.set-label{font-size:12px;color:var(--muted);letter-spacing:.1em;margin-bottom:10px}
.seg{display:flex;background:var(--paper2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:8px;font-size:13px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{
  width:52px;height:40px;border-radius:10px;background:var(--paper2);
  font-size:19px;font-weight:600;flex:none;
}
.stepper button:active{background:var(--line)}
.stepper .val{flex:1;text-align:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.themes{display:flex;gap:10px}
.theme-chip{
  flex:1;height:52px;border-radius:12px;border:2px solid var(--line);
  font-size:13px;font-weight:600;font-family:"Hiragino Mincho ProN",serif;letter-spacing:.1em;
}
.theme-chip.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.shelf-head{padding-bottom:0}
.shelf-tabs{display:flex;gap:6px;margin-top:14px;padding-bottom:10px}
.shelf-tabs button,.shelf-tool{min-height:40px;padding:8px 14px;border-radius:9px;font-size:14px}
.shelf-tabs [aria-pressed="true"]{background:var(--accent);color:var(--paper)}
.shelf-tabs button{display:flex;align-items:center;gap:7px}
.folder-icon{display:inline-block;position:relative;width:19px;height:14px;border:1.7px solid currentColor;border-radius:3px;vertical-align:middle}
.folder-icon:before{content:"";position:absolute;width:7px;height:3px;left:-1.7px;top:-5px;border:1.7px solid currentColor;border-bottom:0;border-radius:3px 4px 0 0}
#folderRack{--row:115px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(21%,132px),1fr));grid-auto-rows:var(--row);gap:0 8px;padding:0 12px;border:6px solid #ae8053;border-top:8px solid #c49a6c;border-bottom:0;
 background:repeating-linear-gradient(0deg,#97704b 0px,#c39a70 5px,#e0b88a 9px,#88603d 10px,transparent 17px,transparent var(--row)),repeating-linear-gradient(93deg,#a88159 0px,#af865d 3px,#a78059 7px,#a88159 30px);
 box-shadow:inset 0 4px 10px #50331c77}
.folder-card{position:relative;align-self:end;min-width:0;height:77px;margin-bottom:10px;background:linear-gradient(145deg,#f7e5c4,#e6cca3);color:#503923;border:1px solid #fbeed7;border-radius:5px 7px 6px 6px;box-shadow:1px 3px 5px #52391e77;display:grid;align-content:center;justify-items:center;gap:5px;padding:5px}
.folder-card:before{content:"";position:absolute;bottom:100%;left:1px;width:42%;height:7px;background:#e9cba0;border-radius:5px 8px 0 0}
.folder-card strong{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 15px/1.3 "Hiragino Mincho ProN",serif}
.folder-card small{font-size:11px}
.folder-card[aria-pressed="true"]{outline:2px solid #684727;outline-offset:-4px}
.folder-new{background:#553a2033;color:#fff5e4;border:1px dashed currentColor;box-shadow:none;font-size:12px}
.folder-new:before{display:none}.folder-new b{font-size:22px;font-weight:400}
#collection{max-width:920px;margin:18px auto 0}
.collection-head{display:flex;align-items:center;gap:5px;padding:0 16px}
.collection-head h2{flex:1;min-width:0;overflow-wrap:anywhere;font:600 19px "Hiragino Mincho ProN",serif}
.shelf-tool{padding:6px 9px;color:var(--accent);border:1px solid var(--line);background:var(--paper)}
#bookList{padding-top:10px}
.book{padding:0 5px 0 0;gap:0}
.book:active{transform:none}
.book-open{flex:1;min-width:0;display:flex;gap:14px;text-align:left;padding:12px}
.book-menu{font-weight:700;min-height:44px;min-width:44px;color:var(--accent)}
#shelfDialog{position:fixed;margin:auto;width:min(92vw,420px);max-height:80dvh;border:1px solid var(--line);border-radius:16px;padding:20px;background:var(--paper);color:var(--ink);box-shadow:0 12px 42px #0003}
#shelfDialog::backdrop{background:#21180e66}
#shelfDialog h2{font:600 18px "Hiragino Mincho ProN",serif;overflow-wrap:anywhere;margin-bottom:14px}
#dialogBody{display:grid;gap:8px}
#dialogBody input[type=text],#dialogBody select{width:100%;padding:10px;border-radius:7px;background:var(--paper2);color:var(--ink);font:inherit;border:1px solid var(--line)}
#dialogBody label{font-size:14px}
.checklist{max-height:43dvh;overflow:auto}
.checklist label{display:flex;gap:10px;align-items:center;min-height:44px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dialog-actions button,#dialogBody button{min-height:42px;padding:8px 12px;border-radius:8px;background:var(--paper2)}
.dialog-actions .primary{color:var(--paper);background:var(--accent)}
#dialogBody .danger{color:#aa4434}
#folderEmpty{padding:22px 16px;color:var(--muted);font-size:14px;text-align:center}
</style>
</head>
<body>

<!-- 本棚 -->
<div id="shelf" inert>
  <div class="shelf-head">
    <h1>書見</h1>
    <nav class="shelf-tabs" aria-label="本の表示">
      <button id="allTab">すべて <span id="bookCount"></span></button>
      <button id="folderTab" aria-pressed="true"><span class="folder-icon" aria-hidden="true"></span>本棚</button>
    </nav>
  </div>
  <div id="memWarn" class="hidden">この環境では保存機能が使えないため、追加した本はページを閉じると消えます。Safariで開くと本と設定が保存されます。</div>
  <div id="folderRack" aria-label="フォルダ"></div>
  <section id="collection">
    <div class="collection-head">
      <button id="leaveFolder" class="shelf-tool hidden" aria-label="フォルダを閉じる">‹</button>
      <h2 id="collectionName">すべての本</h2>
      <button id="chooseBooks" class="shelf-tool hidden">本をまとめる</button>
      <button id="editFolder" class="shelf-tool hidden" aria-label="フォルダの編集">•••</button>
    </div>
    <div id="folderEmpty" class="hidden">このフォルダにはまだ本がありません。</div>
  <div id="bookList"></div>
  <div id="empty">
    <span class="mark">📖</span>
    まだ本がありません。<br>
    「本を追加」から .md / .txt ファイルを選んでください。<br>
    Dropboxのファイルは「ブラウズ」→「Dropbox」から選べます。
  </div>
  </section>
  <button id="addBtn">＋ 本を追加</button>
  <input type="file" id="filePick" accept=".md,.txt,.markdown,text/plain,text/markdown" multiple class="hidden">
</div>

<dialog id="shelfDialog" aria-labelledby="dialogTitle">
  <form id="dialogForm">
    <h2 id="dialogTitle"></h2>
    <div id="dialogBody"></div>
    <div class="dialog-actions">
      <button type="button" id="cancelDialog">閉じる</button>
      <button id="saveDialog" class="primary" type="submit">保存</button>
    </div>
  </form>
</dialog>

<!-- リーダー -->
<div id="reader" class="hidden">
  <div id="readerScroll"><div id="readerContent"></div></div>
  <div class="bar" id="topBar">
    <button class="bar-btn" id="backBtn">‹ 本棚</button>
    <div class="rtitle" id="rTitle"></div>
    <button class="bar-btn" id="setBtn">Aa</button>
  </div>
  <div class="bar" id="bottomBar">
    <div id="progRow">
      <input type="range" id="progSlider" min="0" max="1000" value="0">
      <div id="progPct">0%</div>
    </div>
  </div>
</div>

<!-- 設定 -->
<div id="sheetBack"></div>
<div id="sheet">
  <div class="grab"></div>

  <div class="set-group">
    <div class="set-label">テーマ</div>
    <div class="themes" id="themeRow"></div>
  </div>

  <div class="set-group">
    <div class="set-label">組み方向</div>
    <div class="seg" id="dirSeg">
      <button data-v="h">横書き</button><button data-v="v">縦書き</button>
    </div>
  </div>

  <div class="set-group">
    <div class="set-label">書体</div>
    <div class="seg" id="fontSeg">
      <button data-v="mincho">明朝</button><button data-v="gothic">ゴシック</button><button data-v="maru">丸ゴシック</button>
    </div>
  </div>

  <div class="set-group">
    <div class="set-label">文字サイズ</div>
    <div class="stepper" data-key="fsize"><button data-d="-1">−</button><div class="val"></div><button data-d="1">＋</button></div>
  </div>

  <div class="set-group">
    <div class="set-label">行間</div>
    <div class="stepper" data-key="lheight"><button data-d="-1">−</button><div class="val"></div><button data-d="1">＋</button></div>
  </div>

  <div class="set-group">
    <div class="set-label">字間</div>
    <div class="stepper" data-key="lspace"><button data-d="-1">−</button><div class="val"></div><button data-d="1">＋</button></div>
  </div>

  <div class="set-group">
    <div class="set-label">余白</div>
    <div class="stepper" data-key="rmargin"><button data-d="-1">−</button><div class="val"></div><button data-d="1">＋</button></div>
  </div>

  <div class="set-group">
    <div class="set-label">段落の間隔</div>
    <div class="stepper" data-key="pgap"><button data-d="-1">−</button><div class="val"></div><button data-d="1">＋</button></div>
  </div>

  <div class="set-group">
    <div class="set-label">段落の字下げ</div>
    <div class="seg" id="indentSeg">
      <button data-v="0">なし</button><button data-v="1">一字下げ</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============ 安全なストレージ ============ */
let canStore = true;
try { localStorage.setItem("_t","1"); localStorage.removeItem("_t"); } catch(e){ canStore = false; }

const memSettings = {};
const store = {
  get(k, def){ if(!canStore) return (k in memSettings)? memSettings[k] : def;
    try{ const v = localStorage.getItem(k); return v===null? def : JSON.parse(v);}catch(e){return def;} },
  set(k, v){ if(!canStore){ memSettings[k]=v; return; } try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* IndexedDB(本の保存) — 使えない環境ではメモリに保持 */
let db = null, memBooks = [];
function openDB(){
  return new Promise(res=>{
    if(!("indexedDB" in window)) return res(null);
    try{
      const req = indexedDB.open("shoken", 2);
      req.onupgradeneeded = e => {
        const database = e.target.result;
        if(e.oldVersion < 1) database.createObjectStore("books", {keyPath:"id"});
        if(e.oldVersion < 2) database.createObjectStore("folders", {keyPath:"id"});
      };
      req.onblocked = () => {
        $("memWarn").textContent = "本棚を更新するため、ほかに開いている「書見」のタブを閉じてください。";
        $("memWarn").classList.remove("hidden");
      };
      req.onsuccess = () => {
        req.result.onversionchange = () => { req.result.close(); location.reload(); };
        $("memWarn").classList.add("hidden");
        res(req.result);
      };
      req.onerror = () => res(null);
    }catch(e){ res(null); }
  });
}
const dbAll = () => new Promise(res=>{
  if(!db) return res(memBooks.slice());
  const tx = db.transaction("books").objectStore("books").getAll();
  tx.onsuccess = ()=>res(tx.result||[]); tx.onerror = ()=>res([]);
});
const dbPut = b => new Promise((res,reject)=>{
  if(!db){ memBooks = memBooks.filter(x=>x.id!==b.id); memBooks.push(b); return res(); }
  const tx = db.transaction("books","readwrite"); tx.objectStore("books").put(b);
  tx.oncomplete = res; tx.onabort = () => reject(tx.error);
});
/* ============ テーマ ============ */
const THEMES = {
  shiro:  {label:"白",   paper:"#ffffff", paper2:"#f4f4f4", ink:"#2b2b2b", line:"#e2e2e2", muted:"#8a8a8a", accent:"#2f4f6f"},
  kinari: {label:"生成り", paper:"#f7f2e7", paper2:"#efe8d8", ink:"#3d3830", line:"#e0d8c6", muted:"#948b7a", accent:"#7a5c3e"},
  sumi:   {label:"墨",   paper:"#26282c", paper2:"#1d1f22", ink:"#d5d3cd", line:"#3b3e44", muted:"#84878e", accent:"#8fb0cc"},
  yoru:   {label:"漆黒", paper:"#000000", paper2:"#121212", ink:"#b9b7b0", line:"#2a2a2a", muted:"#6d6d6d", accent:"#7d9db8"}
};
const FONTS = {
  mincho:'"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif',
  gothic:'-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif',
  maru:'"Hiragino Maru Gothic ProN","Yu Gothic",-apple-system,sans-serif'
};
/* 設定の範囲 */
const RANGES = {
  fsize:  {min:12, max:30, step:1,   unit:"px", fmt:v=>v+"px"},
  lheight:{min:1.4, max:2.8, step:0.1, unit:"", fmt:v=>v.toFixed(1)},
  lspace: {min:0, max:0.2, step:0.02, unit:"em", fmt:v=>v.toFixed(2)+"em"},
  rmargin:{min:12, max:56, step:4,  unit:"px", fmt:v=>v+"px"},
  pgap:   {min:0, max:1.5, step:0.25, unit:"em", fmt:v=>v.toFixed(2)+"em"}
};
let settings = Object.assign({
  theme:"kinari", dir:"h", font:"mincho",
  fsize:17, lheight:1.95, lspace:0.04, rmargin:24, pgap:0, indent:1
}, store.get("settings", {}));

function applySettings(){
  const t = THEMES[settings.theme] || THEMES.shiro;
  const r = document.documentElement.style;
  r.setProperty("--paper", t.paper); r.setProperty("--paper2", t.paper2);
  r.setProperty("--ink", t.ink); r.setProperty("--line", t.line);
  r.setProperty("--muted", t.muted); r.setProperty("--accent", t.accent);
  r.setProperty("--fsize", settings.fsize+"px");
  r.setProperty("--lheight", settings.lheight);
  r.setProperty("--lspace", settings.lspace+"em");
  r.setProperty("--rmargin", settings.rmargin+"px");
  r.setProperty("--pgap", settings.pgap);
  r.setProperty("--rfont", FONTS[settings.font]);
  document.getElementById("reader").classList.toggle("vertical", settings.dir==="v");
  document.getElementById("readerContent").classList.toggle("indent", settings.indent==1);
  syncSheetUI();
  store.set("settings", settings);
}

/* ============ Markdownパーサ ============ */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function inline(s){
  s = esc(s);
  s = s.replace(/\|([^《|]+)《(.+?)》/g, "<ruby>$1<rt>$2</rt></ruby>");      // |任意《ルビ》
  s = s.replace(/([一-龠々ヶ〆]+)《(.+?)》/g, "<ruby>$1<rt>$2</rt></ruby>"); // 漢字《ルビ》
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*(.+?)\*/g, "<em>$1</em>");
  s = s.replace(/`(.+?)`/g, "<code>$1</code>");
  return s;
}
function renderMD(src){
  const lines = src.replace(/\r\n?/g,"\n").split("\n");
  const out = []; let para = [], list = null;
  const flushP = ()=>{ if(para.length){ out.push("<p>"+para.map(inline).join("<br>")+"</p>"); para=[]; } };
  const flushL = ()=>{ if(list){ out.push("<"+list.tag+">"+list.items.map(i=>"<li>"+inline(i)+"</li>").join("")+"</"+list.tag+">"); list=null; } };
  for(const raw of lines){
    const line = raw.replace(/\s+$/,"");
    if(!line.trim()){ flushP(); flushL(); continue; }
    let m;
    if(m = line.match(/^(#{1,4})\s+(.*)/)){ flushP(); flushL();
      out.push("<h"+m[1].length+">"+inline(m[2])+"</h"+m[1].length+">"); continue; }
    if(/^(\*{3,}|-{3,}|_{3,})$/.test(line.trim())){ flushP(); flushL(); out.push("<hr>"); continue; }
    if(m = line.match(/^>\s?(.*)/)){ flushP(); flushL();
      out.push("<blockquote><p>"+inline(m[1])+"</p></blockquote>"); continue; }
    if(m = line.match(/^[-*+]\s+(.*)/)){ flushP();
      if(!list||list.tag!=="ul"){ flushL(); list={tag:"ul",items:[]}; } list.items.push(m[1]); continue; }
    if(m = line.match(/^\d+\.\s+(.*)/)){ flushP();
      if(!list||list.tag!=="ol"){ flushL(); list={tag:"ol",items:[]}; } list.items.push(m[1]); continue; }
    flushL(); para.push(line);
  }
  flushP(); flushL();
  return out.join("\n");
}

/* ============ 本棚 ============ */
let books = [], folders = [], currentBook = null;
let showFolders = true, activeFolder = null, importFolder = null;
const $ = id => document.getElementById(id);
const newId = () => crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random().toString(36).slice(2);
const folderById = id => folders.find(folder => folder.id === id);
const ownerOf = bookId => folders.find(folder => folder.bookIds.includes(bookId));
function element(tag, text, className){
  const node = document.createElement(tag);
  if(text != null) node.textContent = text;
  if(className) node.className = className;
  return node;
}
function button(label, action, className){
  const node = element("button", label, className);
  node.type = "button";
  node.addEventListener("click", action);
  return node;
}

// Folder membership lives outside book records so saving progress cannot undo a move.
async function changeShelf(edit, bookChange = {}){
  if(!db){
    const next = folders.map(folder => ({...folder, bookIds:[...folder.bookIds]}));
    edit(next);
    folders = next;
    if(bookChange.put) memBooks.push(bookChange.put);
    if(bookChange.remove) memBooks = memBooks.filter(book => book.id !== bookChange.remove);
  }else{
    await new Promise((resolve, reject) => {
      const tx = db.transaction(bookChange.put || bookChange.remove ? ["folders","books"] : ["folders"], "readwrite");
      const folderStore = tx.objectStore("folders");
      const request = folderStore.getAll();
      let problem;
      request.onsuccess = () => {
        try{
          const rows = request.result;
          const before = new Map(rows.map(row => [row.id, JSON.stringify(row)]));
          edit(rows);
          for(const row of rows){
            if(before.get(row.id) !== JSON.stringify(row)) folderStore.put(row);
            before.delete(row.id);
          }
          for(const id of before.keys()) folderStore.delete(id);
          if(bookChange.put) tx.objectStore("books").put(bookChange.put);
          if(bookChange.remove) tx.objectStore("books").delete(bookChange.remove);
        }catch(err){ problem = err; tx.abort(); }
      };
      tx.oncomplete = resolve;
      tx.onabort = () => reject(problem || tx.error);
    });
  }
}
function moveBooks(rows, ids, destination){
  const target = rows.find(folder => folder.id === destination);
  if(destination && !target) throw new Error("移動先のフォルダが見つかりません。");
  const moving = new Set(ids);
  for(const folder of rows) folder.bookIds = folder.bookIds.filter(id => !moving.has(id));
  if(target) target.bookIds.push(...moving);
}
async function refreshShelf(){
  const [savedBooks,savedFolders] = await Promise.all([dbAll(), db ? new Promise((resolve,reject) => {
    const req = db.transaction("folders").objectStore("folders").getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }) : folders]);
  books = savedBooks;
  folders = savedFolders.sort((a,b) => a.created-b.created || a.id.localeCompare(b.id));
  if(!folderById(activeFolder)) activeFolder = null;
  renderShelf();
}
function renderShelf(){
  const folder = folderById(activeFolder);
  const ids = new Set(books.map(book => book.id));
  $("bookCount").textContent = "("+books.length+")";
  $("folderTab").setAttribute("aria-pressed",showFolders);
  $("allTab").setAttribute("aria-pressed",!showFolders);
  $("folderRack").classList.toggle("hidden",!showFolders);
  const rack = $("folderRack");
  rack.replaceChildren();
  for(const item of folders){
    const card = button("",() => { activeFolder = item.id; renderShelf(); },"folder-card");
    const icon = element("span",null,"folder-icon");
    icon.setAttribute("aria-hidden","true");
    card.append(icon,element("strong",item.name),element("small",item.bookIds.filter(id => ids.has(id)).length+"冊"));
    card.setAttribute("aria-pressed",item.id === activeFolder);
    rack.append(card);
  }
  const create = button("",() => nameFolder(null),"folder-card folder-new");
  create.append(element("b","＋"),element("span","フォルダを作成"));
  rack.append(create);
  for(const id of ["leaveFolder","chooseBooks","editFolder"]) $(id).classList.toggle("hidden",!folder);
  const members = folder && new Set(folder.bookIds);
  const visible = books.filter(book => !members || members.has(book.id)).sort((a,b) => (b.opened||0)-(a.opened||0));
  $("collectionName").textContent = folder ? folder.name+"（"+visible.length+"冊）" : "すべての本";
  $("empty").classList.toggle("hidden",!!folder || books.length > 0);
  $("folderEmpty").classList.toggle("hidden",!folder || visible.length > 0);
  const list = $("bookList");
  list.replaceChildren();
  for(const book of visible){
    const row = element("div",null,"book");
    const open = button("",() => openBook(book),"book-open");
    const pct = Math.round((book.progress||0)*100);
    const info = element("div",null,"book-info");
    const meta = element("div",null,"book-meta");
    const track = element("div",null,"prog-track");
    const fill = element("div",null,"prog-fill");
    fill.style.width = pct+"%";
    track.append(fill);
    meta.append(element("span",pct+"%"),track,element("span",Math.round(book.text.length/1000)+"千字"));
    info.append(element("div",book.title,"book-title"),meta);
    open.append(element("div",null,"spine"),info);
    const menu = button("•••",() => bookMenu(book),"book-menu");
    menu.setAttribute("aria-label",book.title+"の操作");
    row.append(open,menu);
    list.append(row);
  }
}

let submitDialog = null;
function dialog(title, content, saveLabel, action){
  $("dialogTitle").textContent = title;
  $("dialogBody").replaceChildren(...content);
  $("saveDialog").classList.toggle("hidden",!action);
  $("saveDialog").textContent = saveLabel || "保存";
  submitDialog = action;
  if(!$("shelfDialog").open) $("shelfDialog").showModal();
}
$("cancelDialog").onclick = () => $("shelfDialog").close();
$("dialogForm").onsubmit = async event => {
  event.preventDefault();
  if(!submitDialog || $("saveDialog").disabled) return;
  $("saveDialog").disabled = true;
  try{
    await submitDialog();
    $("shelfDialog").close();
  }catch(err){ alert(err.message || "変更を保存できませんでした。"); }
  finally{ $("saveDialog").disabled = false; await refreshShelf(); }
};
function nameFolder(folder){
  const input = element("input");
  input.type = "text"; input.required = true; input.maxLength = 80;
  input.placeholder = "フォルダ名"; input.value = folder?.name || "";
  input.setAttribute("aria-label","フォルダ名");
  dialog(folder ? "フォルダ名を変更" : "フォルダを作成",[input],folder ? "保存" : "作成",async () => {
    const name = input.value.trim();
    if(!name) throw new Error("フォルダ名を入力してください。");
    const id = folder?.id || newId();
    await changeShelf(rows => {
      if(rows.some(row => row.id !== id && row.name === name)) throw new Error("同じ名前のフォルダがあります。");
      if(folder){
        const item = rows.find(row => row.id === id);
        if(!item) throw new Error("フォルダが見つかりません。");
        item.name = name;
      }else rows.push({id,name,created:Date.now(),bookIds:[]});
    });
    activeFolder = id;
  });
  input.focus();
}
$("editFolder").onclick = () => {
  const folder = folderById(activeFolder);
  const rename = button("名前を変更",() => nameFolder(folder));
  const remove = button("フォルダを削除",() => {
    dialog("「"+folder.name+"」を削除",[element("p","中の本は「すべて」に残ります。")],"削除",() => changeShelf(rows => {
      const index = rows.findIndex(row => row.id === folder.id);
      if(index >= 0) rows.splice(index,1);
    }));
  },"danger");
  dialog(folder.name,[rename,remove]);
};
$("chooseBooks").onclick = () => {
  const folder = folderById(activeFolder);
  const available = books.filter(book => !folder.bookIds.includes(book.id));
  const list = element("div",null,"checklist");
  for(const book of available){
    const label = element("label");
    const input = element("input");
    input.type = "checkbox"; input.value = book.id;
    const owner = ownerOf(book.id);
    label.append(input,element("span",book.title+(owner ? "（"+owner.name+"）" : "")));
    list.append(label);
  }
  if(!available.length) list.append(element("p","追加できる本はありません。"));
  dialog("「"+folder.name+"」に本をまとめる",[list],"選んだ本を移動",available.length ? () => {
    const ids = Array.from(list.querySelectorAll(":checked"), input => input.value);
    return changeShelf(rows => moveBooks(rows,ids,folder.id));
  } : null);
};
function bookMenu(book){
  const select = element("select");
  select.id = "moveDestination";
  select.add(new Option("未分類",""));
  for(const folder of folders) select.add(new Option(folder.name,folder.id));
  select.value = ownerOf(book.id)?.id || "";
  const label = element("label","移動先のフォルダ");
  label.htmlFor = select.id;
  const remove = button("本を削除",() => {
    dialog("「"+book.title+"」を削除",[element("p","本文と読書位置がこの端末の本棚から削除されます。")],"削除",
      () => changeShelf(rows => moveBooks(rows,[book.id],null),{remove:book.id}));
  },"danger");
  dialog(book.title,[label,select,remove],"保存",() => changeShelf(rows => moveBooks(rows,[book.id],select.value)));
}
function switchView(useFolders){
  showFolders = useFolders;
  activeFolder = null;
  renderShelf();
}
$("allTab").onclick = () => switchView(false);
$("folderTab").onclick = $("leaveFolder").onclick = () => switchView(true);
$("addBtn").onclick = () => { importFolder = activeFolder; $("filePick").click(); };
$("filePick").onchange = async event => {
  const target = importFolder;
  try{
    for(const file of Array.from(event.target.files)){
      const book = {id:newId(),title:file.name.replace(/\.(md|markdown|txt)$/i,""),
        text:await file.text(),progress:0,opened:Date.now()};
      await changeShelf(rows => moveBooks(rows,[book.id],target),{put:book});
    }
  }catch(err){ alert("本を追加できませんでした。"+err.message); }
  finally{ event.target.value = ""; await refreshShelf(); }
};

/* ============ リーダー ============ */
const scrollEl = $("readerScroll");
let saveTimer = null;

function maxScroll(){
  return settings.dir==="v"
    ? Math.max(1, scrollEl.scrollWidth - scrollEl.clientWidth)
    : Math.max(1, scrollEl.scrollHeight - scrollEl.clientHeight);
}
function getRatio(){
  return settings.dir==="v"
    ? Math.min(1, Math.abs(scrollEl.scrollLeft)/maxScroll())
    : Math.min(1, scrollEl.scrollTop/maxScroll());
}
function setRatio(r){
  if(settings.dir==="v"){
    /* vertical-rl は右端が先頭。scrollLeft は環境により負値 */
    const m = maxScroll();
    scrollEl.scrollLeft = isRTLNegative() ? -r*m : r*m;
  } else {
    scrollEl.scrollTop = r*maxScroll();
  }
}
let _rtlNeg = null;
function isRTLNegative(){
  if(_rtlNeg!==null) return _rtlNeg;
  if(settings.dir!=="v") return false;
  const prev = scrollEl.scrollLeft;
  scrollEl.scrollLeft = -1;
  _rtlNeg = scrollEl.scrollLeft < 0;
  scrollEl.scrollLeft = prev;
  return _rtlNeg;
}

function openBook(b){
  currentBook = b;
  b.opened = Date.now();
  $("rTitle").textContent = b.title;
  $("readerContent").innerHTML = renderMD(b.text);
  $("reader").classList.remove("hidden","bars-hidden");
  $("shelf").classList.add("hidden");
  _rtlNeg = null;
  applySettings();
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
    setRatio(b.progress||0); updateProgUI();
  });});
  dbPut(b);
}
function closeBook(){
  saveProgress();
  $("reader").classList.add("hidden");
  $("shelf").classList.remove("hidden");
  renderShelf();
  currentBook = null;
}
function saveProgress(){
  if(!currentBook) return;
  currentBook.progress = getRatio();
  dbPut(currentBook);
}
function updateProgUI(){
  const r = getRatio();
  $("progSlider").value = Math.round(r*1000);
  $("progPct").textContent = Math.round(r*100)+"%";
}
scrollEl.addEventListener("scroll", ()=>{
  updateProgUI();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveProgress, 600);
}, {passive:true});
$("progSlider").addEventListener("input", e=>{
  setRatio(e.target.value/1000); updateProgUI();
});
$("backBtn").addEventListener("click", closeBook);

/* 中央タップでバー表示切替 */
scrollEl.addEventListener("click", e=>{
  const h = window.innerHeight;
  if(e.clientY > h*0.22 && e.clientY < h*0.78 && !window.getSelection().toString()){
    $("reader").classList.toggle("bars-hidden");
  }
});

/* ============ 設定シート ============ */
function openSheet(){ $("sheet").classList.add("open"); $("sheetBack").classList.add("open"); }
function closeSheet(){ $("sheet").classList.remove("open"); $("sheetBack").classList.remove("open"); }
$("setBtn").addEventListener("click", openSheet);
$("sheetBack").addEventListener("click", closeSheet);

/* テーマチップ生成 */
const themeRow = $("themeRow");
for(const key in THEMES){
  const t = THEMES[key];
  const b = document.createElement("button");
  b.className = "theme-chip"; b.textContent = t.label;
  b.style.background = t.paper; b.style.color = t.ink;
  b.dataset.v = key;
  b.addEventListener("click", ()=>{ settings.theme = key; withRatioKept(applySettings); });
  themeRow.appendChild(b);
}
/* セグメント */
function bindSeg(id, key, cb){
  $(id).querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>{ settings[key] = isNaN(+b.dataset.v)? b.dataset.v : +b.dataset.v;
      withRatioKept(applySettings); if(cb) cb(); });
  });
}
bindSeg("dirSeg","dir", ()=>{ _rtlNeg = null; });
bindSeg("fontSeg","font");
bindSeg("indentSeg","indent");
/* ステッパー */
document.querySelectorAll(".stepper").forEach(st=>{
  const key = st.dataset.key, rg = RANGES[key];
  st.querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>{
      let v = settings[key] + rg.step * (+b.dataset.d);
      v = Math.min(rg.max, Math.max(rg.min, Math.round(v*100)/100));
      settings[key] = v;
      withRatioKept(applySettings);
    });
  });
});
/* レイアウト変更時に読書位置を保つ */
function withRatioKept(fn){
  const inReader = !$("reader").classList.contains("hidden");
  const r = inReader ? getRatio() : 0;
  fn();
  if(inReader) requestAnimationFrame(()=>{ setRatio(r); updateProgUI(); });
}
function syncSheetUI(){
  themeRow.querySelectorAll(".theme-chip").forEach(b=>b.classList.toggle("on", b.dataset.v===settings.theme));
  const segs = {dirSeg:"dir", fontSeg:"font", indentSeg:"indent"};
  for(const id in segs){
    $(id).querySelectorAll("button").forEach(b=>
      b.classList.toggle("on", String(b.dataset.v)===String(settings[segs[id]])));
  }
  document.querySelectorAll(".stepper").forEach(st=>{
    st.querySelector(".val").textContent = RANGES[st.dataset.key].fmt(settings[st.dataset.key]);
  });
}

/* ページ離脱時に保存 */
window.addEventListener("pagehide", saveProgress);
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) saveProgress(); });

/* ============ 起動 ============ */
(async ()=>{
  db = await openDB();
  if(!db) $("memWarn").classList.remove("hidden");
  applySettings();
  await refreshShelf();
  $("shelf").inert = false;
  window.addEventListener("focus", () => { if(!currentBook) refreshShelf(); });
})();
</script>
